<section class="start_wrapper">
  <div class="hpanel">
    <div class="panel-heading clearfix">
      <div class="pull-left">
        <h3>{{'inbox' | translate}}
          <span matTooltip="{{'members_mail_inbox_page_info' | translate}}" class="headTooltip"><i
              class="material-icons">
              help_outline</i></span></h3>
      </div>
      <div class="pull-right">
        <div class="form-group">

        </div>
      </div>
    </div>

    <div class="panel-heading clearfix filter-search-box">

      <fieldset class="scheduler-border" *ngIf="!advanceSearch">
        <form [formGroup]="searchForm" (ngSubmit)="submitSearchForm(searchForm.value)">

          <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="form-group">
              <mat-form-field class="angular-datepicker field-datepicker">
                <input matInput placeholder="{{'start_date' | translate}}" [readonly]="true"
                  (dateChange)="changeDateEvent($event, 'from_date')" [matDatepicker]="fromdate"
                  formControlName="from_date" id="start_date" (click)="fromdate.open()">
                <mat-datepicker-toggle matSuffix [for]="fromdate"></mat-datepicker-toggle>
                <mat-datepicker #fromdate></mat-datepicker>
              </mat-form-field>
              <div class="refresh-icon" (click)="refreshFromDate()">
                <mat-icon>refresh</mat-icon>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="form-group">
              <mat-form-field class="angular-datepicker field-datepicker">
                <input matInput placeholder="{{'to_date' | translate}}" [matDatepicker]="todate" [readonly]="true"
                  (dateChange)="changeDateEvent($event, 'to_date')" formControlName="to_date" id="end_date"
                  min={{minendDate}} (click)="todate.open()">
                <mat-datepicker-toggle matSuffix [for]="todate"></mat-datepicker-toggle>
                <mat-datepicker #todate></mat-datepicker>
              </mat-form-field>
              <div class="refresh-icon" (click)="refreshToDate()">
                <mat-icon>refresh</mat-icon>
              </div>
            </div>
          </div>

          <div class="col-lg-6 col-md-6 col-sm-12">
            <mat-form-field appearance="outline">
              <mat-label>{{'message' | translate}}</mat-label>
              <input matInput class="form-control" formControlName="message" name="message">
            </mat-form-field>
          </div>

          <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="form-group selectDrop">
              <select class="form-control" formControlName="status">
                <option [value]="null" disabled>{{'select_status' | translate}}</option>
                <option [value]="1">{{'status_invite' | translate}}</option>
                <option [value]="2">{{'status_pending' | translate}}</option>
                <option [value]="3">{{'status_completed' | translate}}</option>
              </select>
            </div>
          </div>

          <div class="col-lg-6 col-md-12 col-sm-12">
            <div class="user-btn-block">
              <button type="submit" class="filter-btn search" mat-button>{{'search' | translate}}</button>
              <button type="reset" class="filter-btn reset" mat-button
                (click)="getProductList({},true);searchForm.reset();">{{'reset' | translate}}</button>
            </div>
          </div>
        </form>
      </fieldset>
    </div>

    <div class="panel-body standter">
      <div class="table-responsive">
        <div class="example-container mat-elevation-z8">

          <div *ngIf="process" class="progress_animation">
            <mat-spinner></mat-spinner>
          </div>

          <table mat-table [dataSource]="dataSource" class="table table-striped table-bordered table-hover"
            *ngIf="!process">
            <ng-container matColumnDef="created">
              <th mat-header-cell *matHeaderCellDef> {{'mail_sent_date' | translate}} </th>
              <td mat-cell *matCellDef="let element">
                <span *ngIf="apiService.user.register_type != 0"
                  class="activityStatus {{activityStatus[element.type]}}">{{activityStatus[element.type] | translate}}</span>
                <span class="member-date">{{element.created | date}}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="from">
              <th mat-header-cell *matHeaderCellDef> {{'from' | translate}} </th>
              <td mat-cell *matCellDef="let element"> {{element.created | date}} </td>
            </ng-container>

            <ng-container matColumnDef="message">
              <th mat-header-cell *matHeaderCellDef> {{'message' | translate}} </th>
              <td mat-cell *matCellDef="let element"> <span [innerHtml]="element.message"></span>
                <div *ngIf="( element.workflow_id && element.workflow_id != null && element.issue_certificate )|| ( element.qr_code && apiService.userType !== '9' && element.issue_certificate )"><button type="button"
                    class="filter-btn search"
                    (click)="redirectToActivityPage(element.qr_code, element.workflow_id)">{{'add_activities' | translate}}</button></div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <div class="col-sm-12" *ngIf="!process">
            <div class="alert alert-info no-records" *ngIf="productList.length === 0">
              {{'no_records_found' | translate}}.
            </div>
          </div>
          <mat-paginator (page)="onPageChange(searchForm.value,$event)" [hidePageSize]="true" [pageSize]="10"
            [length]="totalDataCount"></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
